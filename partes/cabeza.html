<!-- script bloqueante: clase «js», entrar siempre arriba (checklist punto 12) y el mando de maqueta (la versión sobria retira la cortina al instante).
     La cortina (módulo Entrada, partes/cortina.html) pone su propio puente: Palleira.cortina.alAbrirse / alRetirarse y
     las clases html.cortina-activa | cortina-abriendo | cortina-fuera. -->
<script>
(function (d) {
  var h = d.documentElement;
  h.classList.add('js');
  window.Palleira = window.Palleira || {};
  // al recargar, Chrome devolvía la página a media portada: se entra siempre arriba, salvo con un #ancla
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  if (!location.hash) window.scrollTo(0, 0);
  // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') h.classList.add('densidad-sobria');
    }
  } catch (e) {}
})(document);
</script>
