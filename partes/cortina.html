<!-- ============ cortina «el monograma» (agente Entrada: partes/cortina.html + css/entrada.css + js/cortina.js) ============
     GENERADO por scripts/entrada-cortina.py: no se edita a mano.
     Fondo de tablas marrón tostado con dos hojas de pajar; en el centro la caja del logo: la A se traza en tres pinceladas, la P cae
     como un cayado y se apoya cruzándola, «ALLEIRA» y «CASA DE ALDEA» se completan; las hojas giran sobre sus bisagras laterales
     y el monograma vuela a [data-cortina-destino] (la marca de la cabecera). Unos 2,5 s.
     El script va ANTES de la cortina: solo con JS se enseña (html.cortina-activa), así que sin JS no aparece nunca.
     Expone Palleira.cortina = { alAbrirse(fn), alRetirarse(fn), abrir(), retirar(), abierta, fuera, enMarcha, marcas } y lanza en
     document «palleira:cortina-abre» (cuando EMPIEZA a abrirse) y «palleira:cortina-fuera». Se retira SIEMPRE: sin JS, con movimiento
     reducido, con densidad sobria, y con red de seguridad (si js/cortina.js no arranca en 2,5 s o se atasca, a los 8 s se va sola). -->

  h.classList.add('js');

    try { d.dispatchEvent(new CustomEvent(nombre)); } catch (e) {}
  }
  function abrir() { if (abierta) return; abierta = true; h.classList.add('cortina-abriendo'); avisar(alAbrir, 'palleira:cortina-abre'); }
  function retirar() {
    if (fuera) return;
    fuera = true;
    clearTimeout(red1); clearTimeout(red2);
    var c = d.getElementById('cortina');
    if (c) c.hidden = true;
    h.classList.remove('cortina-activa', 'cortina-abriendo');
    h.classList.add('cortina-fuera');
    try { if (!location.hash && (w.pageYOffset || h.scrollTop)) w.scrollTo(0, 0); } catch (e) {}
    abrir();
    avisar(alFuera, 'palleira:cortina-fuera');

  }
  P.cortina = {
    alAbrirse: function (f) { if (abierta) { try { f(); } catch (e) { console.warn(e); } } else alAbrir.push(f); },
    alRetirarse: function (f) { if (fuera) { try { f(); } catch (e) { console.warn(e); } } else alFuera.push(f); },
    abrir: abrir, retirar: retirar, enMarcha: false, marcas: {},
    get abierta() { return abierta; }, get fuera() { return fuera; }
  };
  var red1 = setTimeout(function () { if (!P.cortina.enMarcha) retirar(); }, 2500);
  var red2 = setTimeout(retirar, 8000);
  var quieto = false;

})(document, window);
